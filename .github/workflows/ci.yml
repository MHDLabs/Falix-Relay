name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-config-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker buildx build --platform linux/${{ matrix.arch }} --load --tag falix-relay:test .

      - name: Validate Xray config
        run: docker run --rm -e XRAY_UUID=00000000-0000-4000-8000-000000000001 -e PORT=8080 -e WS_PATH=/relay falix-relay:test check
