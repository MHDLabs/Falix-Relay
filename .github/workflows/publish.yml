name: Publish Falix-Relay image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mhdlabs/falix-relay

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Falix-Relay
            org.opencontainers.image.description=Minimal headless VLESS-WebSocket relay powered by official Xray-core
            org.opencontainers.image.source=https://github.com/MHDLabs/Falix-Relay
            org.opencontainers.image.licenses=MIT

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check anonymous pull access
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker logout ghcr.io || true
          if docker pull "${IMAGE_NAME}:latest"; then
            echo "Anonymous pull succeeded."
            echo "- Anonymous pull access: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Image was pushed, but anonymous pull failed. Open the package settings for ghcr.io/mhdlabs/falix-relay and change visibility to Public."
            echo "- Anonymous pull access: **needs Public package visibility**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summary
        run: |
          {
            echo "### Falix-Relay image published"
            echo
            echo "- Image: `ghcr.io/mhdlabs/falix-relay`"
            echo "- Architectures: `linux/amd64`, `linux/arm64`"
            echo "- Tags:"
            echo "```text"
            echo "${{ steps.meta.outputs.tags }}"
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"
