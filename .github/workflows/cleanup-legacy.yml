name: Remove legacy tags and releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-legacy.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all existing GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].id')
          for id in "${release_ids[@]}"; do
            [ -n "$id" ] || continue
            echo "Deleting release ID $id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
          done

      - name: Delete all existing Git tags
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t refs < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" --jq '.[].ref')
          for ref in "${refs[@]}"; do
            [ -n "$ref" ] || continue
            short_ref="${ref#refs/}"
            echo "Deleting tag ref $ref"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/$short_ref"
          done

      - name: Report
        run: echo "Deleted all releases and Git tags that existed when this job ran."
